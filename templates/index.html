<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone Pro — Gym Management Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['var(--font-ui)', 'sans-serif'] },
        colors: { brand: { orange: '#f97316', amber: '#f59e0b', dark: '#080b12' } }
      }
    }
  }
</script>

<style>
:root {
  --bg: #080b12;
  --surface: #0e1320;
  --surface-2: rgba(18, 23, 37, 0.82);
  --surface-3: #1a2238;
  --border: rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);
  --text: #f8fafc;
  --muted: #94a3b8;
  --muted-dim: #64748b;

  --orange: #f97316;
  --orange-soft: rgba(249,115,22,.15);
  --amber: #f59e0b;
  --emerald: #10b981;
  --emerald-soft: rgba(16,185,129,.15);
  --rose: #f43f5e;
  --rose-soft: rgba(244,63,94,.15);
  --blue: #3b82f6;
  --blue-soft: rgba(59,130,246,.15);
  --purple: #8b5cf6;
  --purple-soft: rgba(139,92,246,.15);
  --cyan: #06b6d4;

  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;

  --ease: cubic-bezier(.22,1,.36,1);
  --font-ui: 'Cairo', sans-serif;
}
:root[data-lang="en"] { --font-ui: 'Inter', 'Cairo', sans-serif; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#mainViewport {
  transition: background-image 0.45s ease-in-out;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #263049; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--orange); }

@keyframes fadeSlideUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes popIn { from { opacity:0; transform: scale(.95) translateY(6px);} to { opacity:1; transform:none; } }
@keyframes pulseDot { 0%{box-shadow:0 0 0 0 rgba(16,185,129,.6);} 70%{box-shadow:0 0 0 8px rgba(16,185,129,0);} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0);} }
@keyframes toastIn { from { opacity:0; transform: translateY(14px) scale(.95); } to { opacity:1; transform:none; } }
@keyframes barShrink { from { width: 100%; } to { width: 0%; } }

.tab-content { animation: fadeSlideUp .4s var(--ease) both; }

.glass {
  background: rgba(14, 19, 32, 0.78);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
}

.panel {
  background: var(--surface-2);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
}

.sidebar-nav-item {
  position: relative; z-index: 1;
  display:flex; align-items:center; gap:.75rem;
  padding: .75rem 1rem; border-radius: 14px;
  font-weight:700; font-size:.88rem; color: var(--muted);
  transition: all .25s var(--ease);
  cursor: pointer; width:100%; background:transparent; border:none; text-align: inherit;
}
.sidebar-nav-item:hover { color: #fff; background: rgba(255,255,255,.03); }
.sidebar-nav-item.is-active { color: #fff; }
.sidebar-nav-item svg { width:19px; height:19px; flex-shrink:0; }

#navIndicator {
  position:absolute; right:0; left:0; z-index:0;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--orange), #ea580c);
  box-shadow: 0 8px 24px -6px rgba(249,115,22,.65);
  transition: transform .35s var(--ease), height .35s var(--ease);
  will-change: transform, height;
}

.stat-card {
  position: relative; overflow:hidden;
  background: var(--surface-2);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.25rem 1.35rem;
  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.stat-card:hover { transform: translateY(-3px); border-color: var(--accent, var(--orange)); box-shadow: 0 16px 32px -16px var(--accent, var(--orange)); }
.stat-card .icon-badge {
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background: var(--accent-soft, var(--orange-soft)); color: var(--accent, var(--orange));
}
.stat-card .icon-badge svg { width:20px; height:20px; }
.stat-value { font-weight:900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.table-wrap { border-radius: var(--r-lg); overflow:hidden; border:1px solid var(--border); background: var(--surface-2); backdrop-filter: blur(14px); }
table { width:100%; font-size:.86rem; }
thead th { font-size:.7rem; letter-spacing:.04em; color: var(--muted); font-weight:800; padding: .9rem 1.1rem; background: rgba(22, 28, 45, 0.9); }
tbody tr { transition: background .18s var(--ease); }
tbody tr:hover { background: rgba(255,255,255,.035); }
tbody td { padding: .85rem 1.1rem; }

.badge { display:inline-flex; align-items:center; gap:.35rem; padding:.28rem .7rem; border-radius:999px; font-size:.7rem; font-weight:800; white-space:nowrap; }
.badge-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }

.field-label { display:block; font-size:.74rem; font-weight:700; color: var(--muted); margin-bottom:.35rem; }
.input, select.input {
  width:100%; background: rgba(8, 11, 18, 0.85); border:1px solid var(--border); color: var(--text);
  border-radius: var(--r-sm); padding:.65rem .85rem; font-size:.86rem; font-family: inherit;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.input::placeholder { color: var(--muted-dim); }
.input:focus { outline:none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  font-weight:800; font-size:.82rem; border-radius: var(--r-sm);
  padding:.65rem 1.15rem; cursor:pointer; border:1px solid transparent;
  transition: transform .15s var(--ease), filter .2s var(--ease), box-shadow .2s var(--ease);
  font-family: inherit; white-space: nowrap;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: linear-gradient(135deg, var(--orange), #ea580c); color:#fff; box-shadow: 0 10px 24px -10px rgba(249,115,22,.65); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-blue { background: linear-gradient(135deg, var(--blue), #2563eb); color:#fff; box-shadow: 0 10px 24px -10px rgba(59,130,246,.6); }
.btn-blue:hover { filter: brightness(1.08); }
.btn-emerald { background: linear-gradient(135deg, var(--emerald), #059669); color:#fff; box-shadow: 0 10px 24px -10px rgba(16,185,129,.6); }
.btn-emerald:hover { filter: brightness(1.08); }
.btn-ghost { background: rgba(255,255,255,.05); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: rgba(255,255,255,.1); }
.btn-danger { background: var(--rose-soft); color: #fda4b5; border-color: rgba(244,63,94,.28); }
.btn-danger:hover { background: rgba(244,63,94,.22); }
.btn-xs { padding:.42rem .75rem; font-size:.7rem; border-radius:9px; }

.modal-backdrop {
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:1rem;
  background: rgba(4,6,11,.8); backdrop-filter: blur(8px);
  animation: fadeIn .2s var(--ease);
}
.modal-panel {
  animation: popIn .25s var(--ease);
  background: #111827; border:1px solid rgba(255,255,255,.1); border-radius: var(--r-lg);
}

#toastStack {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  z-index: 100; display:flex; flex-direction:column; gap:.5rem; width: min(92vw, 380px);
}
.toast-item {
  position: relative; overflow:hidden;
  background: #1a2238; border:1px solid var(--border); border-radius: 12px;
  padding: .8rem 1rem; display:flex; align-items:center; gap:.65rem;
  font-size:.82rem; font-weight:700; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6);
  animation: toastIn .25s var(--ease);
}
.toast-item svg { width:18px; height:18px; flex-shrink:0; }
.toast-item.success { border-color: rgba(16,185,129,.4); }
.toast-item.success svg { color: var(--emerald); }
.toast-item.error { border-color: rgba(244,63,94,.4); }
.toast-item.error svg { color: var(--rose); }
.toast-item.info svg { color: var(--blue); }
.toast-bar { position:absolute; bottom:0; right:0; left:0; height:2px; background: currentColor; opacity:.5; animation: barShrink linear forwards; }

.dot-live { width:8px; height:8px; border-radius:50%; background: var(--emerald); animation: pulseDot 2s infinite; }

.lang-switch { display:flex; background: rgba(255,255,255,.05); border:1px solid var(--border); border-radius: 999px; padding: 2px; }
.lang-switch button {
  padding: .35rem .8rem; border-radius:999px; font-size:.72rem; font-weight:800; color: var(--muted);
  background:transparent; border:none; cursor:pointer; transition: all .2s var(--ease); font-family: inherit;
}
.lang-switch button.is-active { background: var(--orange); color:#fff; }

.qr-frame { background:#fff; border-radius: var(--r-md); padding: 12px; display:inline-block; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); }
.hairline { border-color: var(--border); }

@media (max-width: 900px) {
  #sidebar { display:none; }
}
</style>
</head>

<body class="min-h-screen flex flex-col">

<div id="toastStack"></div>

<!-- CONFIRM DIALOG -->
<div id="confirmBackdrop" class="modal-backdrop hidden">
  <div class="modal-panel w-full max-w-sm p-6 text-center space-y-4">
    <div class="w-12 h-12 rounded-2xl bg-rose-500/15 text-rose-400 mx-auto flex items-center justify-center">
      <i data-lucide="alert-triangle" class="w-6 h-6"></i>
    </div>
    <p id="confirmMessage" class="text-sm text-slate-200 font-bold leading-relaxed"></p>
    <div class="flex gap-3">
      <button id="confirmCancelBtn" class="btn btn-ghost flex-1"></button>
      <button id="confirmOkBtn" class="btn btn-danger flex-1"></button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<header id="topbar" class="glass border-b px-6 py-3.5 flex justify-between items-center relative z-20">
  <div class="flex items-center gap-3">
    <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500/30 to-amber-500/15 text-orange-500 border border-orange-500/30 flex items-center justify-center font-black text-lg shadow-inner">⚡</span>
    <h1 class="font-black text-xl tracking-wide bg-gradient-to-r from-orange-400 via-amber-400 to-yellow-400 bg-clip-text text-transparent">FitZone Pro</h1>
  </div>

  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3.5 py-1.5 rounded-full text-xs font-bold">
      <span class="dot-live"></span>
      <span data-i18n="live_floor"></span>
      <span id="liveCountText" class="font-black">0</span>
    </div>
    <div class="lang-switch">
      <button id="langBtnAr" data-lang-btn="ar">AR</button>
      <button id="langBtnEn" data-lang-btn="en">EN</button>
    </div>
  </div>
</header>

<div class="flex-1 flex overflow-hidden relative z-10">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-60 border-l hairline glass flex flex-col justify-between p-4">
    <nav id="navList" class="relative space-y-1.5">
      <div id="navIndicator" style="height:0"></div>
      <button class="sidebar-nav-item is-active" data-tab="dashboard">
        <i data-lucide="layout-dashboard"></i><span data-i18n="nav_dashboard"></span>
      </button>
      <button class="sidebar-nav-item" data-tab="members">
        <i data-lucide="users"></i><span data-i18n="nav_members"></span>
      </button>
      <button class="sidebar-nav-item" data-tab="trainers">
        <i data-lucide="trophy"></i><span data-i18n="nav_trainers"></span>
      </button>
      <button class="sidebar-nav-item" data-tab="memberships">
        <i data-lucide="file-text"></i><span data-i18n="nav_memberships"></span>
      </button>
      <button class="sidebar-nav-item" data-tab="attendance">
        <i data-lucide="scan-line"></i><span data-i18n="nav_attendance"></span>
      </button>
      <button class="sidebar-nav-item" data-tab="payments">
        <i data-lucide="credit-card"></i><span data-i18n="nav_payments"></span>
      </button>
    </nav>

    <button id="exitBtn" class="w-full flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl font-bold text-xs bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/60 text-rose-300 transition">
      <i data-lucide="log-out" class="w-4 h-4"></i><span data-i18n="nav_exit"></span>
    </button>
  </aside>

  <!-- MAIN VIEWPORT WITH BACKGROUND IMAGES -->
  <main id="mainViewport" class="flex-1 overflow-y-auto p-6 md:p-8">

    <!-- 1. DASHBOARD -->
    <section id="tab-dashboard" class="tab-content space-y-5">
      <div class="flex justify-between items-center panel p-5">
        <h2 class="text-xl font-black" data-i18n="dash_title"></h2>
        <span class="px-3.5 py-1.5 bg-orange-500/10 text-orange-400 border border-orange-500/20 rounded-xl text-xs font-black" id="retentionText"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="statCardsGrid"></div>

      <div class="panel p-5 space-y-3">
        <div class="flex justify-between items-center pb-2 border-b hairline">
          <h3 class="font-black text-sm flex items-center gap-2">
            <i data-lucide="flame" class="text-orange-500 w-4 h-4"></i>
            <span data-i18n="live_gym_list"></span>
          </h3>
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
            <span class="dot-live"></span>
            <span data-i18n="live_refresh_badge"></span>
          </span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="th_member_id"></th><th data-i18n="th_name"></th>
              <th class="text-center" data-i18n="th_role"></th><th data-i18n="th_checkin_time"></th>
              <th data-i18n="th_duration"></th><th class="text-center" data-i18n="th_status"></th>
            </tr></thead>
            <tbody id="live_floor_table"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2. MEMBERS -->
    <section id="tab-members" class="tab-content hidden space-y-5">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 panel p-5">
        <h2 class="text-xl font-black" data-i18n="mem_title"></h2>
        
        <div class="flex items-center gap-2.5">
          <!-- SEARCH (COMPACT & SLEEK) -->
          <div class="relative w-56">
            <i data-lucide="search" class="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3 text-slate-400"></i>
            <input type="text" id="memberSearchInput" class="input pr-9 py-1.5 text-xs rounded-xl" data-i18n-ph="search_placeholder">
            <div id="searchSuggestionsDropdown" class="absolute right-0 left-0 top-[115%] bg-[#111827]/95 border hairline rounded-xl shadow-2xl z-30 max-h-56 overflow-y-auto hidden divide-y divide-white/5 backdrop-blur-md"></div>
          </div>

          <!-- FILTER (COMPACT PILL) -->
          <select id="memberFilterSelect" class="input w-36 py-1.5 text-xs rounded-xl font-bold">
            <option value="all" data-i18n="filter_all"></option>
            <option value="active" data-i18n="filter_active"></option>
            <option value="expired" data-i18n="filter_expired"></option>
            <option value="frozen" data-i18n="filter_frozen"></option>
          </select>

          <!-- REGISTER BUTTON -->
          <button id="btnOpenRegister" class="btn btn-primary btn-xs py-2 px-3.5">
            <i data-lucide="user-plus" class="w-4 h-4"></i><span data-i18n="btn_add_member"></span>
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="th_code"></th><th data-i18n="th_member_name"></th><th data-i18n="th_phone"></th>
            <th data-i18n="th_plan"></th><th data-i18n="th_rem_sessions"></th><th data-i18n="th_coach"></th>
            <th data-i18n="th_status"></th><th class="text-center" data-i18n="th_actions"></th>
          </tr></thead>
          <tbody id="members_table"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. TRAINERS -->
    <section id="tab-trainers" class="tab-content hidden space-y-5">
      <div class="flex justify-between items-center panel p-5">
        <h2 class="text-xl font-black" data-i18n="coach_title"></h2>
        <button id="btnOpenAddTrainer" class="btn btn-blue btn-xs py-2 px-3.5">
          <i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="btn_add_trainer"></span>
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="trainers_cards"></div>
    </section>

    <!-- 4. MEMBERSHIPS -->
    <section id="tab-memberships" class="tab-content hidden space-y-5">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 panel p-5">
        <h2 class="text-xl font-black" data-i18n="ms_title"></h2>
        <div class="relative w-64">
          <i data-lucide="search" class="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3 text-slate-400"></i>
          <input type="text" id="membershipSearchInput" class="input pr-9 py-1.5 text-xs rounded-xl" data-i18n-ph="ms_search_ph">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="th_sub_id"></th><th data-i18n="th_member_name"></th><th data-i18n="th_phone"></th>
            <th data-i18n="th_plan_chosen"></th><th data-i18n="th_start_d"></th><th data-i18n="th_end_d"></th>
            <th data-i18n="th_sessions_left"></th><th data-i18n="th_cost"></th><th class="text-center" data-i18n="th_status"></th>
          </tr></thead>
          <tbody id="memberships_table"></tbody>
        </table>
      </div>
    </section>

    <!-- 5. ATTENDANCE -->
    <section id="tab-attendance" class="tab-content hidden space-y-5">
      <div class="max-w-xl mx-auto panel p-7 text-center space-y-5">
        <div class="w-14 h-14 rounded-2xl bg-orange-600/15 text-orange-500 mx-auto flex items-center justify-center">
          <i data-lucide="qr-code" class="w-7 h-7"></i>
        </div>
        <h2 class="text-xl font-black" data-i18n="att_title"></h2>

        <div class="flex flex-wrap gap-2.5 justify-center">
          <button id="btnToggleCamera" class="btn btn-blue btn-xs py-2 px-3.5">
            <i data-lucide="camera" class="w-4 h-4"></i><span id="cameraBtnText"></span>
          </button>
          <label class="btn btn-xs py-2 px-3.5" style="background:var(--purple-soft); color:#c9b6fb; border:1px solid rgba(139,92,246,.3); cursor:pointer;">
            <i data-lucide="image" class="w-4 h-4"></i><span data-i18n="btn_scan_file"></span>
            <input type="file" id="qrFileInput" accept="image/*" class="hidden">
          </label>
        </div>

        <div id="cameraScannerBox" class="hidden rounded-2xl border-2 border-orange-500/70 overflow-hidden bg-black p-2 relative">
          <div id="qr-reader" class="w-full"></div>
          <p class="text-xs text-orange-400 font-bold mt-2 animate-pulse" data-i18n="cam_prompt"></p>
        </div>

        <div class="border-t hairline pt-4 space-y-3">
          <input type="number" id="checkinMemberId" data-i18n-ph="checkin_ph"
                 class="input text-center text-lg font-black text-orange-400 py-2.5">
          <button id="btnManualCheckin" class="btn btn-emerald w-full py-2.5">
            <i data-lucide="check-circle" class="w-4 h-4"></i><span data-i18n="btn_checkin"></span>
          </button>
        </div>
      </div>

      <div class="panel p-5 space-y-3">
        <h3 class="font-black text-sm flex items-center gap-2 text-blue-400">
          <i data-lucide="history" class="w-4 h-4"></i><span data-i18n="audit_24h_title"></span>
        </h3>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="th_log_id"></th><th data-i18n="th_code"></th><th data-i18n="th_name"></th>
              <th class="text-center" data-i18n="th_role"></th><th data-i18n="th_time"></th>
            </tr></thead>
            <tbody id="daily_att_table"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 6. PAYMENTS -->
    <section id="tab-payments" class="tab-content hidden space-y-5">
      <div class="panel p-5">
        <h2 class="text-xl font-black" data-i18n="pay_title"></h2>
      </div>

      <div class="panel p-5 space-y-3">
        <h3 class="text-xs font-bold text-orange-400" data-i18n="pay_new_header"></h3>
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-center">
          <div class="relative">

const App = (() => {

  const state = {
    lang: localStorage.getItem('fz_lang') || 'ar',
    members: [], trainers: [], memberships: [], plans: {}, taxRate: 0.10,
    isCameraRunning: false, html5QrScanner: null, currentTrainerId: null,
    currentTrainerTrainees: []
  };

  const i18n = {
    t(key) { return I18N[state.lang][key] ?? key; },
    setLang(lang) {
      state.lang = lang;
      localStorage.setItem('fz_lang', lang);
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.setAttribute('lang', lang);
      this.apply();
      ui.rebuildIcons();
      members.render(members.currentList());
      trainers.render();
      memberships.render(memberships.currentList());
      attendance.loadDaily();
      payments.render(payments.currentList());
      plans.rebuildLocalizedSelects();
      document.getElementById('langBtnAr').classList.toggle('is-active', lang === 'ar');
      document.getElementById('langBtnEn').classList.toggle('is-active', lang === 'en');
    },
    apply() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = this.t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = this.t(el.dataset.i18nPh); });
    }
  };

  const api = {
    async get(url) {
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.error || i18n.t('toast_generic_error'));
      return data;
    },
    async send(url, method, body) {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error || data.success === false) throw new Error(data.error || i18n.t('toast_generic_error'));
      return data;
    },
    async del(url) {
      const res = await fetch(url, { method: 'DELETE' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error || data.success === false) throw new Error(data.error || i18n.t('toast_generic_error'));
      return data;
    }
  };

  const ui = {
    rebuildIcons() { if (window.lucide) lucide.createIcons(); },

    toast(message, type = 'info', duration = 3000) {
      const icons = { success: 'check-circle-2', error: 'x-circle', info: 'info' };
      const el = document.createElement('div');
      el.className = `toast-item ${type}`;
      el.innerHTML = `<i data-lucide="${icons[type]}"></i><span>${message}</span><div class="toast-bar" style="animation-duration:${duration}ms"></div>`;
      document.getElementById('toastStack').appendChild(el);
      this.rebuildIcons();
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 250); }, duration);
    },

    confirm(message) {
      return new Promise(resolve => {
        const backdrop = document.getElementById('confirmBackdrop');
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('confirmCancelBtn').textContent = i18n.t('confirm_cancel');
        document.getElementById('confirmOkBtn').textContent = i18n.t('confirm_ok');
        backdrop.classList.remove('hidden');
        const cleanup = (result) => { backdrop.classList.add('hidden'); okBtn.onclick = null; cancelBtn.onclick = null; resolve(result); };
        const okBtn = document.getElementById('confirmOkBtn');
        const cancelBtn = document.getElementById('confirmCancelBtn');
        okBtn.onclick = () => cleanup(true);
        cancelBtn.onclick = () => cleanup(false);
      });
    },

    openModal(id) { document.getElementById(id).classList.remove('hidden'); },
    closeModal(id) { document.getElementById(id).classList.add('hidden'); },

    animateValue(el, to, formatter = (v) => Math.round(v)) {
      const from = Number(el.dataset.raw || 0);
      const duration = 500;
      const start = performance.now();
      function step(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = from + (to - from) * eased;
        el.textContent = formatter(value);
        if (progress < 1) requestAnimationFrame(step);
        else { el.dataset.raw = to; }
      }
      requestAnimationFrame(step);
    }
  };

  const nav = {
    init() {
      document.querySelectorAll('.sidebar-nav-item').forEach(btn => btn.addEventListener('click', () => this.switchTab(btn.dataset.tab)));
      window.addEventListener('resize', () => this.moveIndicator());
      this.moveIndicator();
    },
    switchTab(tabName) {
      if (state.isCameraRunning && tabName !== 'attendance') attendance.stopScan();
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.querySelectorAll('.sidebar-nav-item').forEach(btn => btn.classList.toggle('is-active', btn.dataset.tab === tabName));

      if (TAB_BACKGROUNDS[tabName]) {
        document.getElementById('mainViewport').style.backgroundImage = TAB_BACKGROUNDS[tabName];
      }

      this.moveIndicator();
      ui.rebuildIcons();
      const loaders = { dashboard: dashboard.load, members: members.load, trainers: trainers.load, memberships: memberships.load, attendance: attendance.loadDaily, payments: payments.load };
      loaders[tabName] && loaders[tabName].call(loaders[tabName] === members.load ? members : loaders[tabName] === trainers.load ? trainers : loaders[tabName] === memberships.load ? memberships : loaders[tabName] === attendance.loadDaily ? attendance : loaders[tabName] === payments.load ? payments : dashboard);
    },
    moveIndicator() {
      const active = document.querySelector('.sidebar-nav-item.is-active');
      const indicator = document.getElementById('navIndicator');
      if (!active) return;
      indicator.style.height = active.offsetHeight + 'px';
      indicator.style.transform = `translateY(${active.offsetTop}px)`;
    }
  };

  const dashboard = {
    cardsMeta: [
      { key: 'in_gym_now', accent: 'var(--amber)', accentSoft: 'rgba(245,158,11,.15)', icon: 'flame', titleKey: 'stat_in_gym' },
      { key: 'today_attendance', accent: 'var(--blue)', accentSoft: 'var(--blue-soft)', icon: 'calendar-check', titleKey: 'stat_today_att' },
      { key: 'active_members', accent: 'var(--emerald)', accentSoft: 'var(--emerald-soft)', icon: 'users', titleKey: 'stat_active' },
      { key: 'total_revenue', accent: 'var(--orange)', accentSoft: 'var(--orange-soft)', icon: 'wallet', titleKey: 'stat_revenue', isMoney: true },
    ],
    renderShell() {
      const grid = document.getElementById('statCardsGrid');
      grid.innerHTML = this.cardsMeta.map(c => `
        <div class="stat-card" style="--accent:${c.accent}; --accent-soft:${c.accentSoft}">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs font-bold text-slate-400">${i18n.t(c.titleKey)}</p>
            <span class="icon-badge"><i data-lucide="${c.icon}"></i></span>
          </div>
          <h3 class="text-3xl stat-value" id="stat-${c.key}" data-raw="0" style="color:${c.accent}">0</h3>
        </div>
      `).join('');
      ui.rebuildIcons();
    },
    async load() {
      this.renderShell();
      try {
        const data = await api.get('/api/dashboard');
        document.getElementById('liveCountText').textContent = data.in_gym_now ?? 0;
        document.getElementById('retentionText').textContent = `${i18n.t('retention_label')}: ${data.retention_rate ?? 0}%`;

        this.cardsMeta.forEach(c => {
          const el = document.getElementById(`stat-${c.key}`);
          const raw = data[c.key] || 0;
          ui.animateValue(el, raw, v => c.isMoney ? `$${Math.round(v).toLocaleString()}` : Math.round(v).toLocaleString());
        });

        const live = await api.get('/api/attendance/live');
        const tbody = document.getElementById('live_floor_table');
        if (!live.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500 font-bold">${i18n.t('none_in_gym')}</td></tr>`;
          return;
        }
        tbody.innerHTML = live.map((p, i) => `
          <tr style="--i:${i}">
            <td class="font-bold text-orange-400">#${p.person_id}</td>
            <td class="font-bold">${esc(p.name)}</td>
            <td class="text-center">${roleBadge(p.role)}</td>
            <td class="text-slate-400">${esc(p.check_in_time)}</td>
            <td class="text-emerald-400 font-bold">${p.duration_minutes} ${i18n.t('minutes_suffix')}</td>
            <td class="text-center"><span class="badge" style="background:var(--emerald-soft);color:#6ee7a0"><span class="badge-dot"></span>${i18n.t('status_active')}</span></td>
          </tr>
        `).join('');
      } catch (e) { ui.toast(e.message, 'error'); }
    }
  };

  const members = {
    _lastRendered: [],
    currentList() { return this._lastRendered; },
    async load() {
      try {
        const res = await api.get('/api/members');
        state.members = res;
        this.render(res);
      } catch (e) { ui.toast(e.message, 'error'); }
    },
    render(list) {
      this._lastRendered = list;
      const tbody = document.getElementById('members_table');
      if (!list.length) { tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-500 font-bold">${i18n.t('no_members_found')}</td></tr>`; return; }
      tbody.innerHTML = list.map((m, i) => `
        <tr style="--i:${i}">
          <td class="font-bold text-orange-400">#${m.id}</td>
          <td class="font-bold">${esc(m.name)}</td>
          <td class="text-slate-400">${esc(m.phone)}</td>
          <td class="text-xs font-semibold text-slate-300">${esc(m.plan)}</td>
          <td class="font-black text-cyan-400">${m.remaining_sessions}</td>
          <td class="text-slate-400 text-xs">${esc(m.trainer || '—')}</td>
          <td>${statusBadge(m.status)}</td>
          <td class="text-center">
            <div class="flex gap-1.5 justify-center flex-wrap">
              <button class="btn btn-emerald btn-xs" data-act="renew" data-id="${m.id}" data-name="${escAttr(m.name)}">${i18n.t('btn_renew')}</button>
              ${m.is_frozen
                ? `<button class="btn btn-xs" style="background:var(--blue-soft);color:#93c5fd" data-act="unfreeze" data-id="${m.id}">${i18n.t('btn_unfreeze')}</button>`
                : `<button class="btn btn-xs" style="background:var(--amber);color:#1a0d02" data-act="freeze" data-id="${m.id}">${i18n.t('btn_freeze')}</button>`}
              <button class="btn btn-xs" style="background:var(--purple-soft);color:#d8c8fc" data-act="profile" data-id="${m.id}">${i18n.t('btn_inbody')}</button>
              <button class="btn btn-ghost btn-xs" data-act="qr" data-id="${m.id}" data-name="${escAttr(m.name)}">${i18n.t('btn_qr')}</button>
              <button class="btn btn-danger btn-xs" data-act="delete" data-id="${m.id}">${i18n.t('btn_delete')}</button>
            </div>
          </td>
        </tr>
      `).join('');
      ui.rebuildIcons();
    },
    search(query) {
      const q = query.trim().toLowerCase();
      const dropdown = document.getElementById('searchSuggestionsDropdown');
      if (!q) { dropdown.classList.add('hidden'); this.applyFilter(); return; }
      const matches = state.members.filter(m => m.name.toLowerCase().includes(q) || m.phone.includes(q) || String(m.id).includes(q));
      this.render(matches);
      dropdown.innerHTML = matches.length
        ? matches.slice(0, 5).map(m => `
            <div class="p-2.5 hover:bg-white/5 cursor-pointer flex justify-between items-center" data-suggest="${m.id}">
              <div class="flex items-center gap-2.5">
                <span class="w-7 h-7 rounded-lg bg-orange-600/20 text-orange-500 font-bold flex items-center justify-center text-xs">#${m.id}</span>
                <div><p class="font-bold text-xs">${esc(m.name)}</p><p class="text-[10px] text-slate-400">${esc(m.phone)}</p></div>
              </div>
              ${statusBadge(m.status)}
            </div>`).join('')
        : `<div class="p-3 text-center text-xs text-slate-500">${i18n.t('no_suggestions')}</div>`;
      dropdown.classList.remove('hidden');
      dropdown.querySelectorAll('[data-suggest]').forEach(d => d.addEventListener('click', () => { dropdown.classList.add('hidden'); this.openProfile(d.dataset.suggest); }));
    },
    applyFilter() {
      const val = document.getElementById('memberFilterSelect').value;
      const map = { active: 'Active', expired: 'Expired', frozen: 'Frozen' };
      this.render(val === 'all' ? state.members : state.members.filter(m => m.status === map[val]));
    },
    openRegister() { 
      plans.fillSelect('reg_plan');
      plans.updatePricePreview();
      ui.openModal('registerModal'); 
    },
    async submitRegister() {
      const payload = {
        name: document.getElementById('reg_name').value.trim(),
        phone: document.getElementById('reg_phone').value.trim(),
        plan: document.getElementById('reg_plan').value,
        trainer_id: document.getElementById('reg_trainer').value,
        weight: document.getElementById('reg_weight').value,
        height: document.getElementById('reg_height').value,
        fat: document.getElementById('reg_fat').value,
        muscle: document.getElementById('reg_muscle').value
      };
      if (!payload.name || !payload.phone) { ui.toast(i18n.t('toast_fill_required'), 'error'); return; }
      if (!payload.plan) { ui.toast(i18n.t('toast_select_plan'), 'error'); return; }
      try {
        await api.send('/api/members', 'POST', payload);
        ui.toast(i18n.t('toast_member_registered'), 'success');
        ui.closeModal('registerModal');
        ['reg_name','reg_phone','reg_weight','reg_height','reg_fat','reg_muscle'].forEach(id => document.getElementById(id).value = '');
        this.load(); memberships.load(); dashboard.load();
      } catch (e) { ui.toast(e.message, 'error'); }
    },
    openRenew(id, name) {
      document.getElementById('renew_mid').value = id;
      document.getElementById('renewModalTitle').textContent = `${i18n.t('renew_title_prefix')} ${name} (#${id})`;
      document.getElementById('renew_w').value = '';
      document.getElementById('renew_h').value = '';
      document.getElementById('renew_fat').value = '';
      document.getElementById('renew_mus').value = '';

      plans.fillSelect('renew_plan');
      ui.openModal('renewModal');
    },
    async submitRenew() {
      const id = document.getElementById('renew_mid').value;
      const plan = document.getElementById('renew_plan').value;
      if (!plan) { ui.toast(i18n.t('toast_select_plan'), 'error'); return; }

      const payload = {
        plan: plan,
        weight: document.getElementById('renew_w').value.trim() || null,

  const attendance = {
    toggleCamera() { state.isCameraRunning ? this.stopScan() : this.startScan(); },
    startScan() {
      const box = document.getElementById('cameraScannerBox');
      box.classList.remove('hidden');
      document.getElementById('cameraBtnText').textContent = i18n.t('btn_close_cam');
      if (!state.html5QrScanner) state.html5QrScanner = new Html5Qrcode('qr-reader');
      state.html5QrScanner.start(
        { facingMode: 'environment' }, { fps: 15, qrbox: { width: 220, height: 220 } },
        async (decoded) => { this.stopScan(); await this.process(decoded); },
        () => {}
      ).then(() => { state.isCameraRunning = true; }).catch(() => {
        ui.toast(i18n.t('toast_camera_error'), 'error');
        box.classList.add('hidden');
        document.getElementById('cameraBtnText').textContent = i18n.t('btn_open_cam');
      });
    },
    stopScan() {
      if (state.html5QrScanner && state.isCameraRunning) {
        state.html5QrScanner.stop().then(() => {
          document.getElementById('cameraScannerBox').classList.add('hidden');
          document.getElementById('cameraBtnText').textContent = i18n.t('btn_open_cam');
          state.isCameraRunning = false;
        }).catch(() => {});
      } else { document.getElementById('cameraScannerBox').classList.add('hidden'); state.isCameraRunning = false; }
    },
    async scanFile(file) {
      const scanner = new Html5Qrcode('qr-reader');
      try { const text = await scanner.scanFile(file, true); await this.process(text); }
      catch (e) { ui.toast(i18n.t('toast_no_qr_in_image'), 'error'); }
    },
    async manualCheckin() {
      const input = document.getElementById('checkinMemberId');
      const val = input.value.trim();
      if (!val) { ui.toast(i18n.t('toast_enter_id'), 'error'); return; }
      await this.process(val);
      input.value = '';
    },
    async process(code) {
      const payload = /^\d+$/.test(code.trim()) ? { member_id: parseInt(code.trim(), 10) } : { token: code.trim() };
      try {
        const data = await api.send('/api/attendance/checkin', 'POST', payload);
        const roleLabel = data.role === 'Trainer' ? i18n.t('role_trainer') : i18n.t('role_member');
        const extra = data.role === 'Trainer' ? '' : ` · ${data.remaining_sessions} حصص`;
        ui.toast(`${i18n.t('toast_checkin_success')} — ${roleLabel}: ${data.name}${extra}`, 'success', 3500);
        dashboard.load(); this.loadDaily(); members.load(); trainers.load();
      } catch (e) { ui.toast(e.message, 'error'); }
    },
    async loadDaily() {

        tbody.innerHTML = data.map((r, i) => `

            <td class="font-bold text-orange-400">#${r.member_id}</td>

    SPECIALTIES: [['Iron / Bodybuilding','spec_iron'],['Fitness','spec_fitness'],['Cardio','spec_cardio'],['Crossfit','spec_crossfit'],['Boxing','spec_boxing']],

    async load() {

        this.updatePricePreview();

    fillSelect(selectId) {
      const el = document.getElementById(selectId);
      const defaultOpt = `<option value="" disabled selected>${i18n.t('opt_choose_plan')}</option>`;
      el.innerHTML = defaultOpt + Object.keys(state.plans).map(k => `<option value="${escAttr(k)}">${esc(k)} — $${state.plans[k].price}</option>`).join('');
    },
    fillTrainerSelect() {
      const sel = document.getElementById('reg_trainer');
      sel.innerHTML = `<option value="">${i18n.t('no_trainer_opt')}</option>` + state.trainers.map(t => `<option value="${t.id}">${esc(t.name)} (${esc(t.specialty)})</option>`).join('');
    },
    rebuildLocalizedSelects() {
      const methodOptions = this.METHODS.map(([val, key]) => `<option value="${val}">${i18n.t(key)}</option>`).join('');
      document.getElementById('pay_new_method').innerHTML = methodOptions;
      document.getElementById('edit_pay_method').innerHTML = methodOptions;
      document.getElementById('tr_new_spec').innerHTML = this.SPECIALTIES.map(([val, key]) => `<option value="${val}">${i18n.t(key)}</option>`).join('');
    },
    updatePricePreview() {
      const planName = document.getElementById('reg_plan').value;
      const hasTrainer = !!document.getElementById('reg_trainer').value;
      const plan = state.plans[planName];
      if (!plan) {
        document.getElementById('pricePreviewText').textContent = '$0.00';
        return;
      }
      let price = plan.price;
      if (hasTrainer) price = price * (1 + state.taxRate);
      document.getElementById('pricePreviewText').textContent = `$${price.toFixed(2)}${hasTrainer ? ' · ' + i18n.t('trainer_fee_note') : ''}`;
    }
  };

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function escAttr(s) { return esc(s); }
  function statusBadge(status) {
    const map = {
      Active:  ['status_active',  'var(--emerald-soft)', '#6ee7a0'],
      Frozen:  ['status_frozen',  'rgba(245,158,11,.15)', '#fcd34d'],
      Expired: ['status_expired', 'var(--rose-soft)', '#fda4b5'],
    };
    const [key, bg, fg] = map[status] || map.Expired;
    return `<span class="badge" style="background:${bg};color:${fg}"><span class="badge-dot"></span>${i18n.t(key)}</span>`;
  }
  function roleBadge(role) {
    return role === 'Trainer'
      ? `<span class="badge" style="background:var(--orange-soft);color:#fdba74">${i18n.t('role_trainer')}</span>`
      : `<span class="badge" style="background:rgba(6,182,212,.15);color:#67e8f9">${i18n.t('role_member')}</span>`;
  }
  function methodLabel(method) {
    const entry = plans.METHODS.find(([val]) => val === method || val === (method || '').toLowerCase());
    return entry ? i18n.t(entry[1]) : esc(method);
  }

  function wireEvents() {
    document.getElementById('langBtnAr').addEventListener('click', () => i18n.setLang('ar'));
    document.getElementById('langBtnEn').addEventListener('click', () => i18n.setLang('en'));

    document.getElementById('btnOpenRegister').addEventListener('click', () => members.openRegister());
    document.getElementById('btnSubmitRegister').addEventListener('click', () => members.submitRegister());
    document.getElementById('reg_plan').addEventListener('change', () => plans.updatePricePreview());
    document.getElementById('reg_trainer').addEventListener('change', () => plans.updatePricePreview());
    document.getElementById('btnSubmitRenew').addEventListener('click', () => members.submitRenew());

    let searchDebounce;
    document.getElementById('memberSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => members.search(e.target.value), 200);
    });
    document.getElementById('memberFilterSelect').addEventListener('change', () => members.applyFilter());

    document.getElementById('members_table').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const { act, id, name } = btn.dataset;
      ({ renew: () => members.openRenew(id, name), freeze: () => members.freeze(id), unfreeze: () => members.unfreeze(id),
         profile: () => members.openProfile(id), qr: () => members.showQr(id, name), delete: () => members.delete(id) })[act]?.();
    });

    document.getElementById('btnOpenAddTrainer').addEventListener('click', () => trainers.openAdd());
    document.getElementById('btnSubmitAddTrainer').addEventListener('click', () => trainers.submitAdd());
    document.getElementById('trainers_cards').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const { act, id, name } = btn.dataset;
      if (act === 'tr-profile') trainers.openProfile(id);
      if (act === 'tr-qr') trainers.showQr(id, name);
    });
    document.getElementById('tr_prof_checkin_btn').addEventListener('click', () => trainers.checkinCurrent());

    document.getElementById('tr_prof_trainees_table').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const { act, idx, id, name } = btn.dataset;
      if (act === 'tr-trainee-tf') trainers.showTransformation(parseInt(idx, 10));
      if (act === 'tr-trainee-renew') members.openRenew(id, name);
    });

    document.getElementById('membershipSearchInput').addEventListener('input', (e) => memberships.filter(e.target.value));

    document.getElementById('btnToggleCamera').addEventListener('click', () => attendance.toggleCamera());
    document.getElementById('qrFileInput').addEventListener('change', (e) => { if (e.target.files[0]) attendance.scanFile(e.target.files[0]); });
    document.getElementById('btnManualCheckin').addEventListener('click', () => attendance.manualCheckin());
    document.getElementById('checkinMemberId').addEventListener('keydown', (e) => { if (e.key === 'Enter') attendance.manualCheckin(); });

    document.getElementById('pay_new_mid').addEventListener('input', (e) => payments.verifyMember(e.target.value));
    document.getElementById('btnSubmitPayment').addEventListener('click', () => payments.submitNew());
    document.getElementById('btnSubmitEditPayment').addEventListener('click', () => payments.submitEdit());
    document.getElementById('payments_table').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn) return;
      const { act, id, amt, method, ref } = btn.dataset;
      if (act === 'pay-edit') payments.openEdit(id, amt, method, ref);
      if (act === 'pay-delete') payments.delete(id);
    });

    document.querySelectorAll('[data-close-modal]').forEach(btn => btn.addEventListener('click', () => ui.closeModal(btn.dataset.closeModal)));
    document.querySelectorAll('.modal-backdrop').forEach(bd => bd.addEventListener('click', (e) => { if (e.target === bd) bd.classList.add('hidden'); }));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop:not(.hidden)').forEach(bd => bd.classList.add('hidden')); });

    document.getElementById('exitBtn').addEventListener('click', async () => {
      const ok = await ui.confirm(i18n.t('exit_confirm'));
      if (!ok) return;
      document.body.innerHTML = `
        <div class="h-screen flex flex-col items-center justify-center text-center p-6 space-y-3 bg-[#080b12]">
          <span class="text-5xl">🔒</span>
          <h1 class="text-xl font-black text-orange-500">${i18n.t('exit_title')}</h1>
          <p class="text-slate-400 text-xs font-semibold">${i18n.t('exit_sub')}</p>
        </div>`;
    });
  }

  function init() {
    document.documentElement.setAttribute('data-lang', state.lang);
    document.getElementById('langBtnAr').classList.toggle('is-active', state.lang === 'ar');
    document.getElementById('langBtnEn').classList.toggle('is-active', state.lang === 'en');
    document.getElementById('mainViewport').style.backgroundImage = TAB_BACKGROUNDS['dashboard'];
    i18n.apply();
    ui.rebuildIcons();
    nav.init();
    wireEvents();
    plans.load();
    dashboard.load();
    members.load();
    trainers.load();
    memberships.load();
    attendance.loadDaily();
    payments.load();
    setInterval(() => dashboard.load(), 15000);
  }

  return { init, i18n, ui, nav, dashboard, members, trainers, memberships, attendance, payments, plans, state };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
